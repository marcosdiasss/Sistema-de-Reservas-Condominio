<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reservas - condomínio Sun Lake</title>

    <link rel="icon" href="../IMG/logo_sunlake.png">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

<header class="topbar">

    <div class="logo">
        🏢 Condomínio
    </div>

    <div class="usuario">
        Administrador
        <button onclick="logout()" class="btn-sair">Sair</button>
    </div>

</header>

<div class="layout">

    <aside class="sidebar">

        <a href="opcoes.html">
            🏠 Visão geral
        </a>

        <a href="moradores.html">
            👤 Moradores
        </a>

        <a href="areas.html">
                🏊 Áreas comuns
        </a>

        <a href="reservas.html" class="active">
            📅 Reservas
        </a>

    </aside>

    <main class="content">

        <div class="page-header">

            <div>

                <h1>Reservas</h1>

                <p class="subtitle">
                    Controle das reservas das áreas comuns
                </p>

            </div>

            <a
                href="nova_reserva.html"
                class="btn btn-primary">
                + Nova reserva
            </a>

        </div>

        <section class="panel">

            <div class="table-container">

                <table>

                    <thead>

                    <tr>

                        <th>Morador</th>

                        <th>Área</th>

                        <th>Data</th>

                        <th>Início</th>

                        <th>Fim</th>

                        <th>Status</th>

                        <th>Ações</th>

                    </tr>

                    </thead>

                    <tbody id="reservasTabela">

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<div class="modal" id="modalCancelarReserva" aria-hidden="true">
    <div class="modal-backdrop" data-fechar-modal></div>
    <section class="modal-dialog modal-dialog--small" role="dialog" aria-modal="true" aria-labelledby="tituloModalCancelarReserva">
        <div class="modal-header">
            <h2 id="tituloModalCancelarReserva">Cancelar reserva</h2>
            <button type="button" class="modal-close" aria-label="Fechar" data-fechar-modal>&times;</button>
        </div>
        <p id="mensagemCancelarReserva">Deseja realmente cancelar esta reserva?</p>
        <div class="modal-actions">
            <button type="button" class="btn btn-secondary" data-fechar-modal>Voltar</button>
            <button type="button" class="btn btn-cancel" id="confirmarCancelamentoReserva">Cancelar reserva</button>
        </div>
    </section>
</div>

<script src="../JS/script.js"></script>

</body>
</html>
