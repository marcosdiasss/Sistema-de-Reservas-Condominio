<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Novo morador - condomínio Sun Lake</title>

    <link rel="icon" href="../IMG/logo_sunlake.png">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

<header class="topbar">

    <div class="logo">
        🏢 Condomínio
    </div>

    <div class="usuario">
        Administrador
        <button onclick="logout()" class="btn-sair">Sair</button>
    </div>

</header>

<div class="layout">

    <aside class="sidebar">

        <a href="opcoes.html">
            🏠 Visão geral
        </a>

        <a href="moradores.html" class="active">
            👤 Moradores
        </a>

        <a href="areas.html">
                🏊 Áreas comuns
        </a>

        <a href="reservas.html">
            📅 Reservas
        </a>

    </aside>

    <main class="content">

        <h1>Novo morador</h1>

        <p class="subtitle">
            Cadastre um novo morador
        </p>

        <section class="panel">

            <form id="moradorForm">

                <h2>Dados do usuário</h2>

                <div class="form-grid">

                    <div class="form-group">

                        <label>E-mail</label>

                        <input
                            type="email"
                            id="emailMorador"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label>Senha</label>

                        <input
                            type="password"
                            id="senhaMorador"
                            required
                        >

                    </div>

                </div>

                <h2>Dados pessoais</h2>

                <div class="form-grid">

                    <div class="form-group">

                        <label>Nome completo</label>

                        <input
                            type="text"
                            id="nomeMorador"
                            maxlength="100"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label>CPF</label>

                        <input
                            type="text"
                            id="cpfMorador"
                            maxlength="11"
                            inputmode="numeric"
                            placeholder="Somente números"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label>Telefone</label>

                        <input
                            type="text"
                            id="telefoneMorador"
                            maxlength="15"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label>Bloco</label>

                        <input
                            type="text"
                            id="blocoMorador"
                            maxlength="10"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label>Apartamento</label>

                        <input
                            type="text"
                            id="apartamentoMorador"
                            maxlength="3"
                            inputmode="numeric"
                            placeholder="Ex.: 101"
                            required
                        >

                    </div>

                </div>

                <div class="form-actions">

                    <a href="moradores.html"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary">
                        Cadastrar Morador
                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

<script src="../JS/script.js"></script>

</body>
</html>
