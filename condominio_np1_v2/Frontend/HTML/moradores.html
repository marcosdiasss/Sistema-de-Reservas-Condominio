<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Moradores - condomínio Sun Lake</title>

    <link rel="icon" href="../IMG/logo_sunlake.png">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

<header class="topbar">

    <div class="logo">
        🏢 Condomínio
    </div>

    <div class="usuario">
        Administrador
        <button onclick="logout()" class="btn-sair">
            Sair
        </button>
    </div>

</header>

<div class="layout">

    <aside class="sidebar">

        <a href="opcoes.html">
            🏠 Visão geral
        </a>

        <a href="moradores.html" class="active">
            👤 Moradores
        </a>

        <a href="areas.html">
                🏊 Áreas comuns
        </a>

        <a href="reservas.html">
            📅 Reservas
        </a>

    </aside>

    <main class="content">

        <div class="page-header">

            <div>
                <h1>Moradores</h1>
                <p class="subtitle">
                    Gerenciamento dos moradores
                </p>
            </div>

            <a href="cadastro_morador.html"
               class="btn btn-primary">
                + Novo morador
            </a>

        </div>

        <section class="panel">

            <div class="filtros">

                <input
                    type="text"
                    id="pesquisaMorador"
                    placeholder="Pesquisar por nome..."
                >

                <select id="filtroStatus">
                    <option value="">Todos</option>
                    <option value="ATIVO">Ativos</option>
                    <option value="INATIVO">Inativos</option>
                </select>

            </div>

            <div class="table-container">

                <table>

                    <thead>

                    <tr>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Telefone</th>
                        <th>Bloco</th>
                        <th>Apartamento</th>
                        <th>Ações</th>
                    </tr>

                    </thead>

                    <tbody id="moradoresTabela">

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<div class="modal" id="modalEditarMorador" aria-hidden="true">
    <div class="modal-backdrop" data-fechar-modal></div>
    <section class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="tituloModalEditarMorador">
        <div class="modal-header">
            <h2 id="tituloModalEditarMorador">Editar morador</h2>
            <button type="button" class="modal-close" aria-label="Fechar" data-fechar-modal>&times;</button>
        </div>
        <form id="formEditarMorador">
            <input type="hidden" id="editarMoradorId">
            <div class="form-grid">
                <div class="form-group"><label for="editarNomeMorador">Nome completo</label><input type="text" id="editarNomeMorador" maxlength="100" required></div>
                <div class="form-group"><label for="editarCpfMorador">CPF</label><input type="text" id="editarCpfMorador" maxlength="11" inputmode="numeric" required></div>
                <div class="form-group"><label for="editarTelefoneMorador">Telefone</label><input type="text" id="editarTelefoneMorador" maxlength="15" required></div>
                <div class="form-group"><label for="editarBlocoMorador">Bloco</label><input type="text" id="editarBlocoMorador" maxlength="10" required></div>
                <div class="form-group"><label for="editarApartamentoMorador">Apartamento</label><input type="text" id="editarApartamentoMorador" maxlength="3" inputmode="numeric" required></div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" data-fechar-modal>Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar alterações</button>
            </div>
        </form>
    </section>
</div>

<script src="../JS/script.js"></script>

</body>
</html>
