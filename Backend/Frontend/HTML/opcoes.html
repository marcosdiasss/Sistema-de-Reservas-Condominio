<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visão geral - condomínio Sun Lake</title>

    <link rel="icon" href="../IMG/logo_sunlake.png">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>

    <header class="topbar">

        <div class="logo">
            🏢 Condomínio
        </div>

        <div class="usuario">
            Administrador
            <button onclick="logout()" class="btn-sair">
                Sair
            </button>
        </div>

    </header>

    <div class="layout">

        <aside class="sidebar">

            <a href="opcoes.html" class="active">
                🏠 Visão geral
            </a>

            <a href="moradores.html">
                👤 Moradores
            </a>

            <a href="areas.html">
                🏊 Áreas comuns
            </a>

            <a href="reservas.html">
                📅 Reservas
            </a>

        </aside>

        <main class="content">

            <h1>Visão geral</h1>

            <p class="subtitle">
                Visão geral do condomínio
            </p>

            <section class="cards">

                <div class="card">
                    <span class="card-icon">👥</span>
                    <div>
                        <h3>Moradores</h3>
                        <strong id="totalMoradores">0</strong>
                    </div>
                </div>

                <div class="card">
                    <span class="card-icon">🏢</span>
                    <div>
                        <h3>Áreas comuns</h3>
                        <strong id="totalAreas">0</strong>
                    </div>
                </div>

                <div class="card">
                    <span class="card-icon">📅</span>
                    <div>
                        <h3>Reservas ativas</h3>
                        <strong id="totalReservas">0</strong>
                    </div>
                </div>

                <div class="card">
                    <span class="card-icon">✅</span>
                    <div>
                        <h3>Áreas ativas</h3>
                        <strong id="areasAtivas">0</strong>
                    </div>
                </div>

            </section>

            <section class="panel">

                <div class="panel-header">
                    <h2>Últimas reservas</h2>

                    <a href="reservas.html" class="btn btn-primary">
                        Ver todas
                    </a>
                </div>

                <div class="table-container">

                    <table>

                        <thead>
                            <tr>
                                <th>Morador</th>
                                <th>Área</th>
                                <th>Data</th>
                                <th>Horário</th>
                                <th>Status</th>
                            </tr>
                        </thead>

                        <tbody id="reservasTabela">

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

    <script src="../JS/script.js"></script>

</body>
</html>
