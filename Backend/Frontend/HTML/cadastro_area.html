<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nova área - condomínio Sun Lake</title>

    <link rel="icon" href="../IMG/logo_sunlake.png">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

<header class="topbar">

    <div class="logo">
        🏢 Condomínio
    </div>

    <div class="usuario">
        Administrador
        <button onclick="logout()" class="btn-sair">Sair</button>
    </div>

</header>

<div class="layout">

    <aside class="sidebar">

        <a href="opcoes.html">
            🏠 Visão geral
        </a>

        <a href="moradores.html">
            👤 Moradores
        </a>

        <a href="areas.html" class="active">
                🏊 Áreas comuns
        </a>

        <a href="reservas.html">
            📅 Reservas
        </a>

    </aside>

    <main class="content">

        <h1>Nova área comum</h1>

        <p class="subtitle">
            Cadastre uma área disponível no condomínio
        </p>

        <section class="panel">

            <form id="areaForm">

                <div class="form-group">

                    <label>Nome da área</label>

                    <input
                        type="text"
                        id="nomeArea"
                        maxlength="100"
                        placeholder="Ex.: Salão de festas"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Descrição</label>

                    <textarea
                        id="descricaoArea"
                        maxlength="255"
                        rows="4"
                        placeholder="Descrição da área..."
                    ></textarea>

                </div>

                <div class="form-group">

                    <label>Capacidade</label>

                    <input
                        type="number"
                        id="capacidadeArea"
                        min="1"
                        required
                    >

                </div>

                <div class="form-actions">

                    <a
                        href="areas.html"
                        class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary">
                        Cadastrar Área
                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

<script src="../JS/script.js"></script>

</body>
</html>
