<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nova reserva - condomínio Sun Lake</title>

    <link rel="icon" href="../IMG/logo_sunlake.png">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

<header class="topbar">

    <div class="logo">
        🏢 Condomínio
    </div>

    <div class="usuario">
        Administrador
        <button onclick="logout()" class="btn-sair">Sair</button>
    </div>

</header>

<div class="layout">

    <aside class="sidebar">

        <a href="opcoes.html">
            🏠 Visão geral
        </a>

        <a href="moradores.html">
            👤 Moradores
        </a>

        <a href="areas.html">
                🏊 Áreas comuns
        </a>

        <a href="reservas.html" class="active">
            📅 Reservas
        </a>

    </aside>

    <main class="content">

        <h1>Nova reserva</h1>

        <p class="subtitle">
            Reserve uma área comum
        </p>

        <section class="panel">

            <form id="reservaForm">

                <div class="form-group">

                    <label>Morador</label>

                    <select id="moradorReserva" required>

                        <option value="">
                            Selecione o morador
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Área comum</label>

                    <select id="areaReserva" required>

                        <option value="">
                            Selecione a área
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Data da reserva</label>

                    <input
                        type="date"
                        id="dataReserva"
                        required
                    >

                </div>

                <div class="form-grid">

                    <div class="form-group">

                        <label>Hora inicial</label>

                        <input
                            type="time"
                            id="horaInicio"
                            min="08:00"
                            max="22:00"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label>Hora final</label>

                        <input
                            type="time"
                            id="horaFim"
                            min="08:00"
                            max="22:00"
                            required
                        >

                    </div>

                </div>

                <div class="form-actions">

                    <a
                        href="reservas.html"
                        class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary">
                        Confirmar Reserva
                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

<script src="../JS/script.js"></script>

</body>
</html>
